[package]
name = "taphome-config-cli"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "taphome_cli"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
# preserve_order: decoded maps keep wire order, so a re-encode reproduces the original bytes.
# float_roundtrip: parse doubles exactly, so a decoded double re-encodes to the same 8 bytes.
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
