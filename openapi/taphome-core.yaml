  /Core/messages/MessageReconnectRequest:
    post:
      operationId: reconnect
      tags:
      - session
      - devices
      - automations
      summary: Present the SessionId on a new /Core socket and receive the initial sync (devices, interfaces, permissions,
        dashboards, smart rules, Core properties).
      description: |-
        Must be the first message on every working /Core socket, with RequestsId 1. The session is not carried in the URL or in headers.
        A fresh client sends all changeset ids as 0 and an empty DbHash to get every section. The Core skips sections whose changeset id is not newer.
        MessageReconnectResponse accepts a RequestsId that differs from the request, the client maps it to the pending reconnect.
        There is no separate initial-sync request: one response carries Ccus, Devices, UserInfo, LocationInfo, CurrentProtocolVersion, CoreVersionString (format YYYY.R.BUILD), permissions with changeset ids, DashboardSets, Dashboards, SmartRules (each element is a serialized TriggerModel), DeviceTimers, DbHash, SmartRuleErrorStatuses and CoreProperties.
        ReconnectResultId: 0 None, 1 Ok, 2 WrongSession (log in again), 3 TooManyConnections, 4 FaultyStorageClient (client cache is invalid, drop it), 5 RemoteAccessDisabled, 6 AppTooOld, 7 NotReady (Core still starting, retry after 10 s), 8 WrongLocationId.
        Timestamps in the sync (confirmed on Core 2025.2.32396): int64 fields named ...TUtc are .NET ticks (100 ns since 0001-01-01 UTC). ValueLog.ChangedOnTHUtc is TapHome time, seconds since 2016-01-01 UTC.
        Every configuration write is visible in a fresh sync from a new socket seconds later, so the sync is the way to verify a write.
        Sessions have no expiry field and no refresh message. There is no logout message, the client just closes the socket and forgets the SessionId.
        After success the client sends MessageReceiveAcknowledgement every 4 s and a WebSocket ping every 6 s.
        A reconnect with an unknown SessionId returns WrongSession without CurrentProtocolVersion or CoreVersionString (tested on Core 2025.2.32396), so the Core version cannot be read before login.
        A client without a cached DbHash gets FaultyStorageClient (4) together with the current DbHash and must send the reconnect request again with that DbHash. The second response has ReconnectResultId 1 and the complete configuration.

        This message is used for several purposes. Variants:
        - `reconnect`: Present the SessionId on a new /Core socket and receive the initial sync (devices, interfaces, permissions, dashboards, smart rules, Core properties).
        - `getDeviceListOnLogin`: The full interface and device model reaches the client inside the reconnect response.
        - `listSmartRules`: Load all smart rules (triggers), per-type schema versions and error statuses as part of the session handshake.
      security:
      - coreSession: []
      requestBody:
        required: true
        content:
          application/x-protobuf:
            schema:
              $ref: '#/components/schemas/MessageReconnectRequest'
      responses:
        '200':
          description: Typed response, or MessageGenericResponse when the Core reports an error.
          content:
            application/x-protobuf:
              schema:
                oneOf:
                - $ref: '#/components/schemas/MessageReconnectResponse'
                - $ref: '#/components/schemas/MessageGenericResponse'
      x-transport: websocket
      x-ws-endpoint: /Core
      x-proto-include-tag: 110
      x-response-proto-include-tag: 111
      x-kind: action
      x-min-protocol-version: 0
      x-broadcasts: []
      x-evidence:
      - 'TapHome.Android: Com.TapHome.Communication.ClientCommunicationManager.SendReconnect'
      - 'TapHome.Android: Com.TapHome.Communication.ClientCommunicationManager.HandleReconnect'
      - 'TapHome.Android: Com.TapHome.Communication.ClientCommunicationManager.HandleReconnectResultNotOK'
      - 'TapHome.Core.Lib.Model: MessageReconnectRequest, MessageReconnectResponse'
      - 'TapHome.Core.Lib.Model: MessageLoginResponse, MessageReconnectResponse'
      - 'Live test 2026-11-17 (Core 2025.2.32396): the device list is in the reconnect response'
      x-confidence: observed-in-code
      x-verified: true
      x-verification:
        verified: true
        date: '2026-11-17'
        core: 2025.2.32396
        protocol: 89
        note: fresh client first gets ReconnectResultId 4 with a DbHash, then 1 when it reconnects with that DbHash;
          full sync decodes with no unknown fields; the Rust CLI sync (summary, every section, full, written to
          a file) decoded with no errors and no unknown fields
      x-variants:
      - id: reconnect
        summary: Present the SessionId on a new /Core socket and receive the initial sync (devices, interfaces,
