      - id: addTemplateDevicesToExistingPacketParserModule
        summary: Add several devices that are not wrapped in a module to an existing module.
        description: |-
          Same message as importPacketParserTemplate, but the TemplateConfiguration has Devices (each with HardwareParentId set to
          the real module id) and no Modules. The app helper accepts this shape (a config with Devices or Modules, otherwise it
          returns NoDevicesToAdd without sending). This is the shape exported by XmlTemplateExport when only a device list is
          exported (no <Template> wrapper). Whether the Core accepts mixed Devices plus Modules in one request is unknown.
      - id: httpApiConfig
        summary: Configure the HTTP API CCU (Core as HTTP client of third-party devices). Not the TapHome API.
        description: 'Request fields: CcuId (int), ConfigJson (string). Response: MessageHttpApiConfigResponse with
          fields CcuId (int), AddedDevices (GenericDevice[]), RemovedDevices (GenericDevice[]).'
