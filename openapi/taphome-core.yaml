  /Core/messages/MessageDeviceAction:
    post:
      operationId: moduleBlinkLed
      tags:
      - modules
      - io-check
      summary: Identify a module physically by blinking its LED.
      description: |-
        MessageDeviceAction with Action "module-led-start" or "module-led-stop", DeviceId and DeviceName of the module, no parameters.
        The configuration page starts the blinking when opened and stops it on leaving. The ITapHomeBusModule interface also offers a short blink
        but the app has no separate action key for it.

        This message is used for several purposes. Variants:
        - `moduleBlinkLed`: Identify a module physically by blinking its LED.
        - `moduleIdentification`: Start or stop identification mode on a module (alternative to LED blinking).
        - `setDeviceValue`: Set an output value or press a button (also the way to test an output).
      security:
      - coreSession: []
      requestBody:
        required: true
        content:
          application/x-protobuf:
            schema:
              $ref: '#/components/schemas/MessageDeviceAction'
      responses:
        '200':
          description: MessageGenericResponse (ErrorCode 1 is success).
          content:
            application/x-protobuf:
              schema:
                $ref: '#/components/schemas/MessageGenericResponse'
      x-transport: websocket
      x-ws-endpoint: /Core
      x-proto-include-tag: 101
      x-kind: action
      x-min-protocol-version: 0
      x-broadcasts:
      - MessageDeviceValueChangedBroadcast
      x-evidence:
      - 'TapHome.Android: TapHome.Commons.CommunicationHelper.TapHomeBusCommunicationHelper.StartBlinkingLed / StopBlinkingLed'
      - 'TapHome.Android: TapHome.Commons.CommonPages.TapHomeBusModuleConfigurationPage (lines around module-identification)'
      - 'TapHome.Android: TapHome.Commons.DeviceCommunicationHelper.SendDeviceAction'
      - 'TapHome.Android: TapHome.Commons.DeviceActionsHelper.GetDeviceKeyAction / GetValueToBe'
      - 'TapHome.Android: TapHome.Commons.CommonPages.ServiceSettingsPage2 (blind actions)'
      x-confidence: observed-in-code
      x-verified: false
      x-variants:
      - id: moduleBlinkLed
        summary: Identify a module physically by blinking its LED.
        description: |-
          MessageDeviceAction with Action "module-led-start" or "module-led-stop", DeviceId and DeviceName of the module, no parameters.
          The configuration page starts the blinking when opened and stops it on leaving. The ITapHomeBusModule interface also offers a short blink
          but the app has no separate action key for it.
      - id: moduleIdentification
        summary: Start or stop identification mode on a module (alternative to LED blinking).
        description: |-
          MessageDeviceAction with Action "module-identification-start" or "module-identification-stop", DeviceId and DeviceName of the module.
          Used by the module configuration page; the exact difference to module-led-start (probably model specific) is not visible.
      - id: setDeviceValue
        summary: Set an output value or press a button (also the way to test an output).
        description: |-
          Fields: DeviceId, DeviceName, Action (string key), ProtoParameters (typed list: string, int, uint, long, ulong, double, float, bool, short, ushort,
          plus enum wrappers AlarmMode and ClickKind). The app builds them from object[] by runtime type.
          Action keys and parameters seen:
            switch (bool on/off) for Switch devices, dim-level (double 0..1) for analog output and dimmers, blind-level (double) and blind-slope (double)
            for blinds, slide-level (double) for slides, multi-value-switch (double state index; protocol 74 and up, older Cores use "switch"),
            push-button (ClickKind) and push-button-held (bool), temperature (double set point), alarm (AlarmMode), variable-set-value (double),
            cct (double), cct-and-brightness (double, double), hue-brightness (double), hue-value (int HSV packed) and hue-value-and-state (int, bool).
            Blind service keys: blind-force-up-for-time (ushort ms, bool), blind-force-down-for-time, blind-force-up-indefinetely-start/stop,
            blind-force-down-indefinetely-start/stop, blind-declare-current-position-as (bool, double[, double]), blind-start-hardware-calibration,
            blind-start-calibration-up/down, blind-alarm-stop, calibrate-co2-sensor.
          Response: GenericResponse. The app treats ResponseFlags.Handled (1) as success and shows an error when the flag is missing; ErrorCode is not used here.
          The Core refuses a change when the safety smart rule is active or manual override is disabled for the device (ManualChangeTimeout == 0).
          Testing a physical output: the terminal must first be configured as a device (tapHomeBusConfig), then drive that device with action "switch".
          The app has no terminal level "pulse output N" message; whether the Core accepts actions for unconfigured terminals is untested.
