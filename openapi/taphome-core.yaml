          Alarm, PushButton, HueBulb, TunableWhiteBulb, ElectricityMeter, TemperatureSensor, BrightnessSensor, WaterMeter,
          GasMeter, RainCounterSensor, MultiValueSwitch, Slide, AdvancedBlinds, MotionSensor, GenericSensor, Co2AndVocSensor,
          WindSpeedSensor, SmokeSensor, FloodSensor, ImpulseCounter), Model (see table in notes md), CcuId = null (virtual
          devices belong to the Core's virtual interface), DeviceTypeId = int value of DeviceType (0 = None; HeatingDemand,
          CoolingDemand, HeatingCoolingDemand for switches; HeatingCooling, CurrentHeatingCoolingMode, Heating, Cooling, Alert,
          Fan4, Fan3, Presence, LightScene for multi-value switches; the int mapping needs DeviceType from the field catalog),
          DeviceProperties = type-specific defaults (value names and icon ids for multi-value switches, OnStateName/OffStateName
          and SafeValues for typed switches). SerialNumber not set. The Core allocates the id and returns AddedDevice plus the
          full Ccus list. Min protocol versions per model: VirtualBlindGroup 7, VirtualElectricityMeterGroup 14,
          VirtualWrappingElectricityMeter 14, VirtualTemperatureSensor 14, water/gas/rain meters 59, VirtualTunableWhiteLight 74,
          any DeviceType other than None needs 4 (and int device types 26).
      - id: addVirtualVariable
        summary: Create a virtual variable (general, time based or sun based).
        description: |-
          Same message as addVirtualDevice with Interface = "Variable", DeviceTypeId = 0 and no DeviceProperties. Models:
          VirtualVariableGeneral (a user-writable variable), time variables VirtualVariableCurrentYear (v63), Quarter,
          MonthOfTheYear, WeekOfTheMonth, WeekOfTheYear, DayOfWeek, DayOfMonth (v63), HourOfDay, MinuteOfDay (v63 to v70, replaced),
          CurrentMinute (v70), SecondOfDay (v63 to v70), CurrentSecond (v70), DateRange (v53), and sun variables
          VirtualVariableSunUpDownState, VirtualVariableSunAzimuth, VirtualVariableSunElevation. After the add the app opens the
          settings of the new device; value, unit and so on are written with updateDeviceProperties. The Core allocates the id.
          Confirmed on Core 2025.2.32396 for VirtualVariableGeneral, see addDevice for the response. The time and sun variable models were not tried.
