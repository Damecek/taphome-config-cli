  /Core/messages/MessageGetScriptLastRunValuesRequest:
    post:
      operationId: getScriptLastRunValues
      tags:
      - scripts
      summary: Fetch the values captured during the last execution of a formula, script smart rule or device script,
        for debugging.
      description: |-
        Request: LastRunId = ScriptLastRunValuesIdentifier {ObjectIdType (0 Device, 1 Ccu, 2 Smartrule), ObjectId (int; the TriggerId for smart rules, -1 for an unsaved rule), ScriptKey (string; names which script of a device/CCU, empty for smart rules)}.
        Response class name has a typo in the app ("Reponse"): MessageGetScriptLastRunValuesReponse with LastRunId and Values = ScriptLastRunValues {Values (per-statement snapshots, list of name -> DataType maps), Result (DataType), RunTimestampUtc, RunDuration}. DataType is a tagged union (see the data type table in 04-automations.md).
        The script engine records snapshots at Start/Progress/Finish phases and keeps only the last run in memory on the Core, so the data is empty until the rule has run at least once. Used by the "last run" button in the script editor. Works for formula (type 12), script (type 45) and evaluation rules.
        Live result (Core 2025.2.32396): for an existing Packet Parser device the call answered with only the echoed LastRunId and no values. After the Core ran a freshly created device script, LastRunId {ObjectIdType 0, ObjectId <device id>, ScriptKey "ReadStateScriptPacketParser"} returned the last run with Result and RunTimestampUtc.
        Result is a DataType. For a double, SerializerValueTypeId is 4 and SerializerValueBytes holds the IEEE-754 bits of the value as an int64. RunTimestampUtc is a .NET tick count like the other ...TUtc fields. The snapshot list was not decoded.
      security:
      - coreSession: []
      requestBody:
        required: true
        content:
          application/x-protobuf:
            schema:
              $ref: '#/components/schemas/MessageGetScriptLastRunValuesRequest'
      responses:
        '200':
          description: Typed response, or MessageGenericResponse when the Core reports an error.
          content:
            application/x-protobuf:
              schema:
                oneOf:
                - $ref: '#/components/schemas/MessageGetScriptLastRunValuesReponse'
                - $ref: '#/components/schemas/MessageGenericResponse'
      x-transport: websocket
      x-ws-endpoint: /Core
      x-proto-include-tag: 436
      x-response-proto-include-tag: 437
      x-kind: read
      x-min-protocol-version: 61
      x-broadcasts: []
      x-evidence:
      - 'TapHome.Android: TapHome.Commons.CommunicationHelper.LastRunValuesCommunicationHelper.GetLastRunValues'
      - 'TapHome.Android: Com.TapHome.Communication.ClientCommunicationManager.GetScriptLastRunValues'
      - 'TapHome.Core.Lib.Model: TapHome.Core.Lib.Model.ScriptLastRunValues'
      - 'TapHome.Android: TapHome.Commons.CommunicationHelper.LastRunValuesCommunicationHelper'
      - 'TapHome.Android: TapHome.Commons.CommonPages.FormulaSmartRulePage.CreateScriptElement (LastRunId with ObjectIdType.Smartrule)'
      - 'TapHome.Core.Lib.Common: TapHome.Core.Lib.Formulas.Script.CaptureLastRunValues'
