x-taphome:
  protocolVersion: 89
  appBuild: 2025.2.32375
  wire:
    endpoints:
      core: ws://<host>/Core
      identify: ws://<host>/Identify
      setUp: ws://<host>/SetUp
      forgottenPassword: ws://<host>/ForgottenPassword
      port: 80
      tls: none on the LAN
      subProtocol: none
      compression: none (permessage-deflate is not proposed)
      cloudTunnel: the cloud returns full tunnel URLs (GET tunnelendpoints3), same protocol
    framing: One WebSocket binary frame is exactly one protobuf-net serialization of MessageBase. No length prefix,
      no envelope. Text frames are rejected. /Identify sends a bare LocationInfo instead.
    subtypeEncoding: MessageBase has one nested length-delimited field per message class, field number = the include
      tag (x-proto-include-tag). The field holds the message own fields. A client must write that field before field
      1 (RequestsId), because the Core reader needs the subtype to create the instance. Deeper hierarchies nest
      one more level per inheritance step.
    hierarchyRule: Every class hierarchy is serialized from its root base class, also when a field is declared with
      a derived type. Example, confirmed on a live Core, a GenericDevice inside a list is written as the DeviceBase
      fields at the top level plus the GenericDevice own fields nested under include tag 100 (see x-proto-includes
      on the base schema). The nested subtype field comes first, the base fields follow.
    initialSync: A client without a cached DbHash sends MessageReconnectRequest with an empty DbHash and gets ReconnectResultId
      4 (FaultyStorageClient) together with the current DbHash. It reconnects with that DbHash and then receives
      ReconnectResultId 1 with the complete configuration in one message. Confirmed on a live Core.
    requestsId: MessageBase field 1, int32 varint, written only when non-zero. The client keeps one counter per
      socket and numbers requests 1, 2, 3 and so on (the reconnect request is 1). A response, or a progress message,
      carries the RequestsId of its request. The login request uses 0.
    messageTypes:
      '0': None
      '1': Request
      '2': Response
      '3': Broadcast
      '4': Stream
      '5': Acknowledgement
      '6': Container
      '7': Progress
    acknowledgement:
      minProtocolVersion: 23
      intervalSeconds: 4
      timeoutSeconds: 10.5
      stamp: (MessageType << 32) | RequestsId as int64
      message: MessageReceiveAcknowledgement (include tag 100), field 1 repeated int64, not packed
      exempt:
      - acknowledgements
      - Stream messages
      - MessageLoginRequest
      - MessageCheckTunnelStatusRequest
      - inner messages of a MessageContainer
      onTimeout: the socket is closed with code 1008
    keepalive:
      webSocketPingIntervalSeconds: 6
      pongTimeoutSeconds: 10
      closeCodeOnNoPong: 1002
    container: MessageContainer (include tag 383, protocol >= 47), field 1 repeated bytes. Core to client batching,
      each element is a full MessageBase. Inner messages are not acknowledged one by one.
    errorModel:
      response: MessageGenericResponse (include tag 102). Any request can be answered with it, and write operations
        normally are.
      success: ErrorCode == 1 (CommonErrorCodes.Ok). Some app flows treat any reply as success, a client should
        always check ErrorCode and ResponseFlags.
      ResponseFlags:
        '0': None
        '1': Handled
        '2': Failed
      CommonErrorCodes:
        '1': Ok
        '2': Unauthorized
        '3': Exception
        '4': ParameterTooShortOrLong
        '5': AlreadyExist
        '6': DoesNotExist
        '7': InvalidRequest
        '8': MissingEmail
        '9': WrongEmailFormat
        '10': MissingPassword
        '11': PasswordTooShort
        '12': WrongEmailOrPassword
        '13': MissingParameter
        '14': AlreadyInProgress
        '15': DeserializationException
        '16': IncompatibleCoreSmartRuleVersion
        '17': UpdateStarted
        '18': UpdateFinished
        '19': UpdateFailed
        '20': AtLeastOneAdmin
        '21': CoreOffline
        '22': RequestNotSupported
        '23': PasswordDoesNotMeetRequirements
        '24': UserIsPlaceholder
        '25': Cancelled
        '26': RequiresCoreUpdate
        '27': NotEnoughSpace
        '28': MissingData
      notes:
      - Device actions are successful when ResponseFlags has Handled set.
      - ErrorCode 2 (Unauthorized) is the permission error.
      - ErrorCode 22 (RequestNotSupported) and 15 (DeserializationException) are the likely answers to a message
        the Core does not know.
    enums:
      LoginResult:
        '0': None
        '1': Ok
        '2': WrongPassword
        '3': WrongLogin
        '4': WrongAuthToken
        '5': Deleted
        '6': AppTooOld
      ReconnectResult:
        '0': None
        '1': Ok
        '2': WrongSession
        '3': TooManyConnections
        '4': FaultyStorageClient
        '5': RemoteAccessDisabled
        '6': AppTooOld
        '7': NotReady
        '8': WrongLocationId
      TriggerType:
        '0': None
        '1': AlarmStateTrigger
        '2': AlarmTrigger
        '3': BlindsAccordingToSunTrigger
        '4': BoilerPIDTrigger
        '5': CountdownTimerTrigger
        '6': DelayedAirVentTrigger
        '7': DeviceStatusNotificationTrigger
        '8': DisableBoilerTrigger
        '9': EmergencyAlarmTrigger
        '10': EquithermicRegulationTrigger
        '11': EvaluationTrigger
        '12': FormulaTrigger
        '13': HysteresisControlTrigger
        '14': KeepDefaultValuesTrigger
        '15': LightingTimerTrigger
        '16': LightSceneSequenceTrigger
        '17': LimitFloorTemperatureTrigger
        '18': LinkTrigger
        '19': MultiValueSwitchTrigger
        '20': OnePushButtonBlindControlTrigger
        '21': OpenBlindsOnSensorTrigger
        '22': PresenceSimulationTrigger
        '23': ProtectBlindsFromWindTrigger
        '24': ProtectFromOverheatTrigger
        '25': PushButtonBlindControlTrigger
        '26': PushButtonDimmingTrigger
        '27': PushButtonTrigger
        '28': ReduceHeatingTrigger
        '29': SensorNotificationTrigger
        '30': SimpleAlarmTrigger
        '31': SunEventTrigger
        '32': SwitchTrigger
        '33': TemperaturePID2Trigger
        '34': TimeoutTrigger
        '35': TimerTrigger
        '36': WatchdogTrigger
        '37': WeekScheduleTrigger
        '38': MultiValueSwitchLightSceneSequenceTrigger
        '39': LightingTimerTrigger2
        '40': DailyScheduleTrigger
        '41': SequencerTrigger
        '42': ProtectBlindsFromMildWindTrigger
        '43': AccessTrigger
        '44': DoorBellTrigger
        '45': ScriptTrigger
        '10000': ProtectBlindsFromStrongWindSafetyTrigger
        '10001': LimitTemperatureSafetyTrigger
      note: These enums are not in the schema catalog. The matching properties (LoginResultId, ReconnectResultId,
        ResponseFlagsId, ErrorCode, TriggerModel.TriggerTypeId) are plain integers. TriggerType is TapHome.Core.Lib.Model.IFTTT.TriggerType.
    scalars:
      integers: varint. Negative int32 is sign-extended to 10 bytes. A zero value is not written.
      bool: varint 0 or 1, false is not written
      string: length-delimited UTF-8, null is not written, an empty string is written
      bytes: length-delimited
      double: fixed64, 0.0 is not written
      float: fixed32
      repeated: one field per element, not packed, unless a property has x-proto-packed
      map: 'repeated entry messages {1: key, 2: value}, key and value are always written'
      nullable: written only when it has a value
    bcl:
      Guid: 'nested message: field 1 fixed64 = bytes 0..7 of the .NET Guid.ToByteArray() (mixed-endian, Python uuid.bytes_le),
        field 2 fixed64 = bytes 8..15. An empty Guid is a zero-length message.'
      TimeSpan: 'nested message: field 1 zigzag varint value, field 2 varint scale (Days 0, Hours 1, Minutes 2,
        Seconds 3, Milliseconds 4, Ticks 5, MinMax 15). The scale is the largest unit that divides the value exactly.
        1 tick is 100 ns.'
      DateTime: the TimeSpan encoding of (value minus 1970-01-01T00:00:00), no time zone conversion, treat as UTC.
  passwordHash:
    algorithm: lower-case hex of SHA-512 applied iterations times. The first round hashes the UTF-8 bytes of password
      concatenated with a fixed salt, each next round hashes the previous binary digest.
    iterations: 2
    output: 128 lowercase hex characters
    salt: fixed constant compiled into the app, see docs/auth.md
    usedIn:
    - MessageLoginRequest.PasswordHashOrAuthorizationToken
    - MessageSetNewPasswordRequest.NewPasswordHash
    - create/change password messages for local users
    cloudAccountSecret: for a cloud account the hashed text is the per-location authorization token (Guid, lower-case
      with hyphens) instead of a password
