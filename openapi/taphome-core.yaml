        core: 2025.2.32396
        protocol: 89
        note: empty for an existing device before it ran a script; after a freshly created Packet Parser device
          script ran, LastRunId with ObjectIdType 0 and ScriptKey ReadStateScriptPacketParser returned Result (DataType,
          SerializerValueTypeId 4 = double, bytes = IEEE-754 bits as int64) and RunTimestampUtc; the per-phase variable
          snapshot list is decoded (phase 0 held the variable with NaN before its first value, phase 1 was empty);
          after a script change the next last-run showed the new Result within four seconds
