components:
  securitySchemes:
    coreSession:
      type: apiKey
      in: header
      name: X-TapHome-Session-Virtual
      description: The Core session Guid. It is issued in MessageLoginResponse.SessionId after a login message and
        presented as SessionId inside MessageReconnectRequest, which must be the first message on every /Core socket.
        OpenAPI cannot express a credential inside a message body, so this scheme is a placeholder. No such HTTP
        header exists and nothing is sent in the WebSocket handshake.
      x-virtual: true
    cloudBearer:
      type: http
      scheme: bearer
      description: 'Cloud user token returned in the token field of login2 or register2. Sent as Authorization:
        Bearer <token>. The client has no refresh flow, a 401 logs the user out.'
    tapHomeApiToken:
      type: apiKey
      in: query
      name: token
      description: Token of the TapHomeApi slave interface (a Guid). Shown in the app on the TapHomeApi page and
        regenerated with MessageRefreshTapHomeApiTokenRequest.
