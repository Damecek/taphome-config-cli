  MessageDeviceListUpdatedBroadcast:
    post:
      operationId: broadcastDeviceListUpdated
      tags:
      - devices
      summary: Core pushes the whole device and interface list after structural changes.
      description: |-
        Payload: Ccus[] and Devices[] (complete lists). The client merges it with PutDevicesIncrementally(allDevices: true), which also
        removes devices that are no longer present, and replaces its CCU list. The app also clears its "devices update in progress"
        flag when this broadcast arrives, so the Core is expected to send it after a TapHome Bus configuration save, a module add,
