        - `assignDevicesToZone`: Put devices into a zone.
        - `assignDevicesToCategory`: Put devices into a category.
        - `updateDeviceProperties`: Write device or module properties, including all scripts, variables, service attributes and actions, in one call.
      security:
      - coreSession: []
