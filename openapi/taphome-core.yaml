        summary: Add one empty Packet Parser device under an existing module.
        description: |-
          ConfigJson is a TemplateConfiguration with ProtocolVersion 66 and one entry in Devices (not Modules). The device has
          Name (unique), Model and HardwareParentId = module device id (required; the app refuses to send without it on v66).
          DeviceProperties is omitted. Models: PacketParserSwitch, PacketParserDimmer, PacketParserThermostat,
          PacketParserMultiValueSwitch, PacketParserTemperatureSensor, PacketParserElectricityMeter, PacketParserReedContact,
          PacketParserVariable, PacketParserPushButton, PacketParserSlide, PacketParserHSBLight, PacketParserWhiteLight,
          PacketParserAnalogInput (v78 per ModbusPacketParserAnalogInputMinProtocolVersion), PacketParserBlind. The Core fills in
          default properties; scripts are written afterwards with updateDeviceProperties.
          Not tested on a live Core. The module-plus-device form of the same message is confirmed, see addPacketParserModule.
      - id: importPacketParserTemplate
        summary: Import a Packet Parser template. The app parses the XML locally and sends the finished module with
          all devices as one JSON message.
        description: |-
          There is no "template file" message. The app (1) parses the XML template (XmlTemplateImport), (2) lets the user fill the
          ImportParameters (default IpAddress etc.), name prefix, zone, category and choose which devices to keep, (3) replaces
          every "$[ParamId]" token in names and in all DeviceProperties values (including script text) with the chosen values,
          (4) serializes the resulting TemplateConfiguration to JSON and (5) sends it once as MessageHttpApiConfigRequest
          {CcuId, ConfigJson}. ConfigJson shape: {ProtocolVersion:<template protocolVersion>, Modules:[{Name, Model, Id (negative
          template id), ZoneId, CategoryId, DeviceProperties:{...}, Devices:[{Name, Model, Id, ZoneId, CategoryId,
          DeviceProperties:{...}}]}], Id:<template guid or 00000000-...>, Revision, Name}. Ids inside a template are negative
          placeholders (-1 is the module, -2.. the devices). They are only valid inside this JSON, so cross references such as
          FormulaDeviceVariable.DeviceId inside the DeviceVariables/Variables property use the same negative ids, and the Core is
          expected to rewrite them to real ids when it creates the devices (inferred: the client never remaps them). HardwareParentId
          on devices inside a Module is left at 0; the Core derives the parent from nesting. The Core allocates all real ids and
          returns the created module and devices in AddedDevices. One request is one transaction from the app's point of view; the
          Core's atomicity on partial failure is unknown. ErrorCode 26 means the Core is too old for the template (template
          protocolVersion greater than the Core's, or unknown model/property). The app's "template unsupported" warning appears when
          template.ProtocolVersion is not supported by the connected Core. Zone and category ids are Guids (empty = none) and are only
          meaningful from protocol 31. Properties of the template that no importer step touches (for example the template Name,
          Producer, Description, CcuModel) are not sent, except Name. If the CCU is not a Packet Parser CCU the app refuses to list the
          template (CcuModel must equal "PacketParserCCU").
