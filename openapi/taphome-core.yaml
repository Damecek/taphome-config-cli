  /Core/messages/MessageUpdateTriggerModelsRequest:
    post:
      operationId: upsertSmartRules
      tags:
      - automations
      summary: Create or update one or more smart rules (also used to enable/disable, rename, reorder priority and
        duplicate).
      description: |-
        Request: TriggerModels (List<TriggerModel>). One message is both "add" and "update"; the Id decides.
        Create: Id = 0. The Core allocates the Id (client never does) and returns it only through MessageTriggerModelsUpdatedBroadcast.
        Update: send the complete TriggerModel with its existing Id. The app always sends the whole object after editing a deserialized copy; there is no partial update.
        Fields the client sets on create: TriggerType (TriggerTypeId), TriggerParameters (the concrete ...TriggerParameters subclass that matches the type and version), Name (unique-ified client side, for example "Formula", "Formula 2"), IsEnabled = true, Version = TriggerVersions[type] from the reconnect response, Priorities = empty dictionary. IsLimitingConditionEnabled/LimitingConditionType/LimitingConditionParameters are optional (not allowed for safety triggers, type id >= 10000).
        Fields the Core computes and the client should not send meaningfully: TriggerInputs and LimitingConditionInputs (device connection index derived from the parameters; the app sets TriggerInputs = null when duplicating), ChangesetId, IsDeleted.
        Priorities: Dictionary<deviceId, priority>, per output device; higher number wins. The app edits it when the user drags rules in a device's output list and sends the changed rules in one batch. Whether the Core fills Priorities for new rules itself is not visible in the client (see open questions).
        Enable/disable = send the rule with IsEnabled flipped. Duplicate = clone, Id = 0, new Name, Priorities = null, TriggerInputs = null.
        Response: MessageGenericResponse; ErrorCode 1 = saved, 16 = Core does not support this rule version (app toast "incompatible Core smart rule version"). The Core persists on receipt (it is the source of truth; the client cache is only updated from the broadcast).
        Saved formulas and scripts are not validated by this call in the client. The Core parses them and reports problems afterwards through the trigger error operations.
        Permissions: the user needs UserSettingsCanEdit on the rule (existing) or CreateSmartRuleCanEdit for the type (new); the Core enforces this.
        Atomicity across the list is unknown; the app sends several rules in one message for bulk enable/disable and priority changes.
        Confirmed on Core 2025.2.32396 for one create (Id 0, TriggerTypeId 12 formula, Version 13, IsEnabled false, ChangesetId 0, FormulaTriggerParameters with one input variable, one output variable and EvaluationFormula "Va", ValueLogType 62 on both): MessageGenericResponse ErrorCode 1 and one MessageTriggerModelsUpdatedBroadcast.
        The Core filled TriggerInputs (instant connection, value type 62 to the device) and Priorities ({<device id>: 8}) itself, kept IsEnabled false and raised the changeset. A client does not need to send either field.
        The Core did not allocate a new id. It reused the id of a soft-deleted rule (a tombstone slot). New rule ids are therefore not max + 1, and a client must find its rule by name and changeset in the broadcast or in the next sync.
        Not tested: updating an existing rule, enabling a rule, several rules in one message, other rule types.
      security:
      - coreSession: []
      requestBody:
        required: true
        content:
          application/x-protobuf:
            schema:
              $ref: '#/components/schemas/MessageUpdateTriggerModelsRequest'
      responses:
        '200':
          description: MessageGenericResponse (ErrorCode 1 is success).
          content:
            application/x-protobuf:
              schema:
                $ref: '#/components/schemas/MessageGenericResponse'
      x-transport: websocket
      x-ws-endpoint: /Core
      x-proto-include-tag: 299
      x-kind: write
      x-min-protocol-version: 24
      x-broadcasts:
      - MessageTriggerModelsUpdatedBroadcast
      x-evidence:
      - 'TapHome.Android: TapHome.Commons.SmartRuleCommunicationHelper.UpdateSmartRules'
      - 'TapHome.Android: TapHome.Commons.CommonPages.SmartRulePage`1.InitSmartRule'
      - 'TapHome.Android: TapHome.Commons.SmartRuleCommunicationHelper.DuplicateSmartRule'
      - 'TapHome.Android: TapHome.Commons.CommonHelpers.MultiSelectHelper.HandleSmartRuleEnableDisableClicked'
      - 'TapHome.Android: CommonUI.CommonMainList.ViewModel.OutputSmartRuleElementsSectionViewModel.UpdateSmartRulesPriorities'
      x-confidence: observed-in-code
      x-verified: true
      x-verification:
        verified: true
        date: '2026-11-17'
        core: 2025.2.32396
        protocol: 89
        note: 'exercised for one case only: create (Id 0) of a disabled formula rule (type 12, version 13) with
          one input and one output variable; ErrorCode 1, one MessageTriggerModelsUpdatedBroadcast; the Core filled
          TriggerInputs and Priorities and reused the id of a soft-deleted rule; later runs through the Rust CLI
          also exercised enable and disable of that rule (the whole stored model re-sent with IsEnabled changed;
          ErrorCode 1, ChangesetId grew, rest unchanged, no rule errors) and an update of its EvaluationFormula
          (same Id; stored model equals the sent one); each write was also followed by MessageAffectingTriggersInfoSubscribedBroadcast;
          a round trip of all 87 live rules (12 trigger types) through decode and encode reproduced the Core bytes;
          creating an enabled rule, creating or updating a rule of another type not tried'
