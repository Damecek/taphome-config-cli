        summary: Create a Packet Parser module (one target host and protocol) by sending a one-module TemplateConfiguration
          JSON.
        description: |-
          Request: CcuId, ConfigJson. ConfigJson is a serialized TemplateConfiguration (see notes md, "Config JSON") with
          ProtocolVersion 66 and one entry in Modules. Module: Name = unique name "PacketParserModule-<protocol>[-n]" (app makes it
          unique against all device names), Model = "PacketParserModule" + capitalised protocol, i.e. PacketParserModuleHttp,
          PacketParserModuleTcp, PacketParserModuleUdp, PacketParserModuleFtp, PacketParserModuleMqtt. DeviceProperties as the
          app sends them: IpAddress (host or DNS name), StayConnected ("True"/"False": true for tcp, udp, ftp, false for http and
          mqtt), Port (http 80, ftp 21, udp 4096, tcp 1024, mqtt 1883). The Core allocates the module id and returns the new
          module (and any children) in MessageHttpApiConfigResponse.AddedDevices; RemovedDevices is empty for adds. The app does
          not cache the response, it relies on the device list broadcast. Core older than v66 uses the legacy HttpApiConfig
          format ({Devices:[HttpApiDeviceInfo], TemplateDevices:[]}) and Model "PacketParserModule"; ignore it. A Core that
          cannot handle the content answers MessageGenericResponse with ErrorCode 26.
          Confirmed on Core 2025.2.32396 for one case only: an HTTP module (PacketParserModuleHttp) with one PacketParserVariable device, sent as a hand-built ConfigJson, with no template XML involved.
          Module properties IpAddress, Port, StayConnected, InternalPollInterval, UseHttps; device properties ReadStateScriptPacketParser, InternalPollInterval, IsReadOnly. Placeholder ids Id -1 (module) and -2 (device), HardwareParentId 0, empty Guids for CategoryId and ZoneId.
          The response listed both objects in AddedDevices (no RemovedDevices) and one MessageDeviceListUpdatedBroadcast followed. The Core allocated both ids and set the child's HardwareParentId to the new module id (negative ids are only labels).
          The module got Interface IHardwareParentModule, DeviceType 7001 and serial PacketParser--<8 hex>. The device got serial PacketParser-Variable-<8 hex>.
          The Core filled every other property with defaults. The module got 23 keys, among them ReadScriptPacketParser, CustomVariables, VltEpsilons, ServiceAttributesScriptsPacketParser, ServiceActionsScriptsPacketParser, ShouldDoPeriodicWrite, DeviceVariables, WriteScriptPacketParser, TemplateIdentity, User, Password, IgnoreSSLErrors and HttpAuthentification "None". The HTTP module did not keep a StayConnected key.
          The device's ReadScriptPacketParser was filled with a commented example script. The state script ran at once: the device value (type 62) showed the script result in a sync taken seconds later.
