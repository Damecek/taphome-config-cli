  /Core/messages/MessageUpdateMultipleDevicesPropertiesRequest:
    post:
      operationId: updateMultipleDevicesProperties
      tags:
      - devices
      - zones
      - scripts
      summary: Apply a property delta to one or many devices (the main device configuration write).
      description: |-
        Granularity is a property delta: DeviceIds[] plus DeviceProperties (string to string) that contains only the keys that changed.
        The app builds the delta by comparing its edited copy with the dictionary received from the Core (GetChangedDeviceProperties).
        The same delta is applied to every listed device, so multi-select edits only send properties common to all.
        Known keys seen in the app: Name, ZoneId and CategoryId (Guid strings), DeviceType (int id as string from protocol 26, enum name before),
        StartupValueSource, ManualChangeTimeout, Icon, IconId, OnStateName, OffStateName, OnStateIconId, OffStateIconId, SafeValues,
        SerializedValueLogTypeConversion, Value0Name..Value9Name and MultiValueSwitchValue* for multi-value switches, plus interface and
        model specific keys (for example Configuration JSON for RGB/blind/DMX, ScreensSerialized for zone controllers).
        Keys the UI never sends because they are read-only or hidden: ID, Model, SerialNumber, PollInterval, IP, LogValues, IsIgnored,
        HardwareParentId, OutputType, OutputAddress, IsHardwareReadable, CanStartupValueBeSet.
        Changing DeviceType also sends the type specific defaults (state names, icons, safe values) because the UI rewrites them;
        a client that only sets DeviceType gets the type without those defaults.
        Response is GenericResponse; the app only checks that the task completed, not ErrorCode.
        Values are validated by the Core, not by the app (the app only filters the type picker to types valid for the interface).
        Persists immediately.
        Confirmed on Core 2025.2.32396. {"Name": "<new name>"} renames a device (ErrorCode 1, one MessageDeviceUpdatedBroadcast, new name in the next sync), so Name is a normal property key.
        {"ReadStateScriptPacketParser": "8"} on a Packet Parser variable also gave ErrorCode 1 and one MessageDeviceUpdatedBroadcast. The new script ran at once (the value changed within seconds, no restart).

        This message is used for several purposes. Variants:
        - `updateMultipleDevicesProperties`: Apply a property delta to one or many devices (the main device configuration write).
