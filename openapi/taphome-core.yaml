  /Core/messages/MessageTapHomeBusConfigRequest:
    post:
      operationId: tapHomeBusConfig
      tags:
      - modules
      summary: Add a TapHome Bus module by serial number, or define which terminals of a module become which devices.
      description: |-
        Fields: DeviceId (the module's device id; 0 when adding), CcuId (bus interface id; 0 when configuring), ConfigJson (JSON of TapHomeBusModuleConfig).
        Two uses.
        Add module: DeviceId 0, CcuId = bus CCU, ConfigJson {"AddModules":["<serial>"]}. The app first checks the serial: at least 16 characters and exactly
        three '-' characters, and that no device with this serial exists. Response AddedDevices[] holds the module device; empty means "not found on the bus".
        Configure terminals: DeviceId = module id, CcuId 0, ConfigJson {"Devices":[{"Index":n,"Type":"...","ExtraAttributes":{...}}], "PWMGroups":[...]}.
        The JSON is the COMPLETE desired mapping of all configured terminals of the module, not a delta: terminals missing from the list are removed
        (the UI shows the counts of AddedDevices and RemovedDevices from the response). Index is 1 based inside its terminal group.
        Type values: Reed, PushButton, ImpulseCounter, Switch, SwitchOnUO, Blind, BlindOnUO, EncoderBlind, CurrentLimitedBlind, EncoderSlat, Slide, SlideOnUO,
        EncoderSlide, CurrentLimitedSlide, Thermometer, AnalogOutput, AnalogInput, LedDimmer, Dimmer, AnalogOutputOnDO, AnalogOutputOnUO, RGB, WG (Wiegand), TunableWhite.
        ExtraAttributes keys: DeviceName, DeviceZoneId, DeviceCategoryId (protocol 16 and up), TerminalType (DI, DO, UI, UO, AO, NTC), TerminalUp and TerminalDown
        (blinds, "DO<n>" or "UO<n>"), RGBOutputRed/Green/Blue/White and TunableWhiteOutput1/2 ("AO<n>" or "UO<n>"), OutputAddress/DmxOutputType (DMX),
        AnalogOutputOnPWMPeriod/PowerRequired/Priority/GroupId, OnStateName/OffStateName (presence sensors), DeviceTypeProperties (JSON {"DeviceType":"<id>", defaults...},
        protocol 62 and up, only when the user picked a non-default type that the interface allows).
        The app does not send the configuration when the exported JSON equals the one it exported on load.
        Persistence: applied and stored by the Core; the app only toggles a "devices update in progress" flag until MessageDeviceListUpdatedBroadcast arrives.
        A new terminal device gets serial "<moduleSN>:<Type>[-<TerminalType>]-<index>" and HardwareParentId = module device id.
      security:
      - coreSession: []
      requestBody:
        required: true
        content:
          application/x-protobuf:
