    PacketParserVariable, PacketParserPushButton, PacketParserSlide, PacketParserHSBLight, PacketParserWhiteLight,
    PacketParserAnalogInput (v78 per ModbusPacketParserAnalogInputMinProtocolVersion), PacketParserBlind. The Core fills in
    default properties; scripts are written afterwards with updateDeviceProperties.
