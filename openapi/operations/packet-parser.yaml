# Operations for the Packet Parser, Modbus, templates, scripts and virtual devices.
# Format of every entry (all files in this directory share it):
#   id                  unique operationId
#   tag                 one of the spec tags
#   kind                read | write | subscribe | action
#   request / response  protobuf class names from work/catalog/official.json (null when none)
#   broadcasts          broadcast classes the Core pushes as a consequence
#   summary, description, minProtocolVersion, evidence, confidence
#   endpoint            optional, WebSocket endpoint (default /Core)
#   security            optional, "none" for operations that need no session
#   bareResponse        optional, the endpoint sends the response class without a MessageBase wrapper
# Source: static reading of the decompiled TapHome Official Android app 2025.2.32375. Nothing here is verified against a live Core
# unless openapi/verification.yaml says so. "GenericResponse OK" means MessageGenericResponse with ErrorCode == 1.

- id: updateDeviceProperties
  tag: scripts
  kind: write
  request: MessageUpdateMultipleDevicesPropertiesRequest
  response: MessageGenericResponse
  broadcasts:
  - MessageDeviceUpdatedBroadcast
  summary: Write device or module properties, including all scripts, variables, service attributes and actions,
    in one call.
  description: |-
    Request: DeviceIds (int[]), DeviceProperties (string to string). The app sends only the properties the user changed
    (GetChangedDeviceProperties) and, for several devices, the same map to all of them. Script text is stored as a plain
    string property; there is no compiled form on the wire. Property keys per device kind are listed in the notes md.
    Scripts and their companion data are separate keys: the script (for example WriteScriptPacketParser), the input variables
    (JSON of List<FormulaDeviceVariable> in "Variables" or "DeviceVariables", the key present on the device decides), custom
    variables ("CustomVariables", "CustomDeviceVariables", JSON of List<FormulaVariable>), "ShouldDoPeriodicWrite" ("True"/
    "False") and "InternalPollInterval" (integer, unit not visible; the app shows a number picker). The app saves several
    related keys together when one script dialog changes them, so send script and variables in one request. Core older than
    v16 uses MessageUpdateDevicePropertiesRequest (DeviceId, DeviceName, DeviceProperties) per device; irrelevant for v66+.
    The device name is also a property key ("Name"), as the add-virtual-device flow shows. Persistence is immediate (the Core
    stores the device); the Core is expected to answer with MessageGenericResponse and ErrorCode 1 (the helper only checks
    that the task completed without a failure flag).
  minProtocolVersion: 16
  evidence:
  - 'TapHome.Android: TapHome.Commons.DeviceCommunicationHelper.UpdateDeviceProperties'
  - 'TapHome.Android: TapHome.Commons.ServiceSettingsManager.SaveChanges / CreateServiceScriptElement'
  - 'TapHome.Android: TapHome.Commons.CommonPages.ServiceScriptPage'
  confidence: observed-in-code
