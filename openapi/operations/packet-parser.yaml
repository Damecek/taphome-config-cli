  broadcasts:
  - MessageDeviceListUpdatedBroadcast
  - MessageCcuUpdatedBroadcast
  summary: Create the Packet Parser interface (CCU) that holds Packet Parser modules.
  description: |-
    Model must be "PacketParserCCU". The app sends Properties = {Model:"PacketParserCCU", SerialNumber:"", PollInterval:"60",
    IP:"invalid", LogValues:"false", IsIgnored:"false", Port:"", Password:"", Name:<translated interface name>}.
    The Core allocates CcuId and returns the new GenericCcu in MessageAddCcuResponse.Ccu. The app only offers this CCU type
    when the Core protocol version is >= 66 (CcuType.PacketParser). MQTT has its own CCU model "MqttCCU" (v69) with a separate
    UI page; its properties are not visible in the client code. Which broadcast follows is not visible in the client; the app
    refreshes its CCU list from MessageDeviceListUpdatedBroadcast.Ccus, so that is the likely one.
