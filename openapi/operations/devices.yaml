  summary: Create a device (the app uses it only for virtual devices and variables).
  description: |-
    Fields the app fills: DeviceName (made unique client-side against existing device names), Icon (always DeviceIcon.Unknown),
    Interface (the C# interface class name, for example "Switch", "Dimmer", "Thermostat", "PushButton", "HueBulb"),
    Model (for example "VirtualSwitch", "VirtualAnalogOutput", "VirtualThermostatDummy", "VirtualAlarm", "VirtualPushButton",
    "VirtualMultiValueSwitch", "VirtualRgbLight", "VirtualTunableWhiteLight", "VirtualTemperatureSensor"), DeviceProperties
    (type specific defaults such as OnStateName/OffStateName/OnStateIconId/OffStateIconId/SafeValues, produced by DeviceTypeHelper),
    DeviceTypeId (int DeviceType, 0 for none), CcuId (the app always sends null, so the Core attaches the device to the virtual CCU).
    SerialNumber is never sent. The Core allocates the int device id. Response: AddedDevice (full GenericDevice) and Ccus (full CCU list).
    Confirmed on Core 2025.2.32396 for a virtual variable: DeviceName, Icon 0, Interface "Variable", Model "VirtualVariableGeneral", DeviceTypeId 0, no CcuId and no DeviceProperties is enough.
    The Core attached the device to the virtual CCU (CcuId 1 there), generated the serial number (VIRT-<guid>) and filled the default DeviceProperties (LogValues, IsIgnored, DeviceType, ZoneId, CategoryId, HardwareParentId, SerializedValueLogTypeConversions, IsReadOnly, IconId).
    One MessageDeviceListUpdatedBroadcast followed. The write persisted at once: a new socket saw the device seconds later. Other models and interfaces were not tried.
    The app then opens the settings page for the new device, where the user edits properties with updateMultipleDevicesProperties.
    Physical devices (TapHome Bus, Modbus, Packet Parser, ZigBee, KNX) are not created with this message; see tapHomeBusConfig and
    the interface specific config messages. Protocol gates: device type ids need protocol 26 (4 for ids that existed before), tunable
    white light needs 74, water/gas meters and rain gauge 59, electricity meter group 14.
