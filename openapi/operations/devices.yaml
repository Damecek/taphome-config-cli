# Operations for devices, modules, interfaces (CCU), zones, inputs and outputs (tags: devices, modules, interfaces, io-check, zones).
# Format of every entry (all files in this directory share it):
#   id                  unique operationId
#   tag                 one of the spec tags
#   kind                read | write | subscribe | action
#   request / response  protobuf class names from work/catalog/official.json (null when none)
#   broadcasts          broadcast classes the Core pushes as a consequence
#   summary, description, minProtocolVersion, evidence, confidence
#   endpoint            optional, WebSocket endpoint (default /Core)
#   security            optional, "none" for operations that need no session
#   bareResponse        optional, the endpoint sends the response class without a MessageBase wrapper
# Source: static reading of the decompiled TapHome Official Android app 2025.2.32375. Nothing here is verified against a live Core
# unless openapi/verification.yaml says so. "GenericResponse OK" means MessageGenericResponse with ErrorCode == 1.

- id: getDeviceListOnLogin
  tag: devices
  kind: read
  request: MessageReconnectRequest
  response: MessageReconnectResponse
  broadcasts: []
  summary: The full interface and device model reaches the client inside the reconnect response.
  description: |-
    There is no "get all devices" request. Confirmed on Core 2025.2.32396: the complete device and interface list arrives in MessageReconnectResponse (Ccus, Devices, DeviceTimers, plus changeset ids and smart rules), after the client reconnects with the DbHash from the first (ReconnectResultId 4) response.
    The app code also lists Ccus, Devices and DeviceTimers on MessageLoginResponse. The test did not look for devices in the login response, so treat the reconnect response as the only source.
    Each GenericDevice already holds identity (ID, Name, Icon, Model, Interface, SerialNumber, HardwareParentId, ZoneId, CategoryId,
    DeviceType int id), the property dictionary (DeviceProperties, string to string), CurrentValues (ValueLog per value type id),
    SupportedValueLogTypes and SupportedActionTypes. Transport and login details are covered by the transport notes.
  minProtocolVersion: 0
  evidence:
  - 'TapHome.Android: Com.TapHome.Communication.ClientCommunicationManager.HandleReconnect'
  - 'TapHome.Core.Lib.Model: MessageLoginResponse, MessageReconnectResponse'
  - 'Live test 2026-11-17 (Core 2025.2.32396): the device list is in the reconnect response'
