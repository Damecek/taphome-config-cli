    (the UI shows the counts of AddedDevices and RemovedDevices from the response). Index is 1 based inside its terminal group.
    Type values: Reed, PushButton, ImpulseCounter, Switch, SwitchOnUO, Blind, BlindOnUO, EncoderBlind, CurrentLimitedBlind, EncoderSlat, Slide, SlideOnUO,
    EncoderSlide, CurrentLimitedSlide, Thermometer, AnalogOutput, AnalogInput, LedDimmer, Dimmer, AnalogOutputOnDO, AnalogOutputOnUO, RGB, WG (Wiegand), TunableWhite.
