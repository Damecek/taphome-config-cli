- id: replaceModule
  tag: modules
  kind: write
  request: MessageUpdateDeviceSerialNumbersRequest
  response: MessageGenericResponse
  broadcasts:
  - MessageDeviceUpdatedBroadcast
  - MessageDeviceListUpdatedBroadcast
  summary: Replace a TapHome Bus module by another one while keeping the devices and their configuration.
  description: |-
    Composite flow, no dedicated message. Preconditions: the new module is already a device in the list (added with tapHomeBusConfig AddModules).
    The target module type must be in the compatibility list of the old type (TapHomeBusModuleReplaceHelper) and must have enough terminals.
    Steps the app runs:
      1. If the new module already has terminal devices, delete them first (deleteDevices, forceDelete) after a captcha confirmation.
      2. updateDeviceSerialNumbers with {childDeviceId: newSerial} for every old child that fits on the new module and HardwareParentId = new module id.
         Children without a matching terminal on the new module (terminal index above the new count) go to a delete list.
         Children whose serial ends in "-INT" or "-EXT" (internal sensors) are moved as they are.
      3. updateMultipleDevicesProperties on the new module with the module level properties that differ between old and new
         (limited to the model's ServiceSettingsSupportedProperties).
      4. deleteDevice for the old module, then deleteDevices for the leftover children and the new module's INT/EXT devices.
      5. For protocol below 13 the app also sends MessageRestartCoreRequest; newer Cores need no restart.
    The sequence is not atomic: a failure in the middle leaves a half-moved configuration.
  minProtocolVersion: 46
  evidence:
  - 'TapHome.Android: TapHome.Commons.CommonPages.TapHomeBusModuleReplacePage (ReplaceModule, OnDeviceSerialNumbersUpdated,
    DeleteDevice, OnModuleReplaced)'
  - 'TapHome.Android: TapHome.Commons.CommonHelpers.TapHomeBusModuleReplaceHelper'
