  - 'TapHome.Android: TapHome.Commons.CommunicationHelper.LastRunValuesCommunicationHelper'
  - 'TapHome.Android: TapHome.Commons.CommonPages.FormulaSmartRulePage.CreateScriptElement (LastRunId with ObjectIdType.Smartrule)'
  - 'TapHome.Core.Lib.Common: TapHome.Core.Lib.Formulas.Script.CaptureLastRunValues'
  confidence: observed-in-code
- id: listSmartRules
  tag: automations
  kind: read
  request: MessageReconnectRequest
  response: MessageReconnectResponse
  broadcasts: []
  summary: Load all smart rules (triggers), per-type schema versions and error statuses as part of the session handshake.
  description: |-
    The app never asks for smart rules directly. It sends MessageReconnectRequest after login with SmartRules2ChangesetId set to the highest TriggerModel.ChangesetId it has cached (0 for an empty cache). The Core answers MessageReconnectResponse with:
    - SmartRules (List<byte[]>): each element is a protobuf-encoded TriggerModel. Rules changed since the supplied changeset come back, including soft-deleted ones (TriggerModel.IsDeleted = true), which the client drops from its cache. A CLI should send 0 to get everything and ignore IsDeleted rows.
    - TriggerVersions (Dictionary<int,int>): TriggerTypeId -> schema version the Core supports for that type. 0 or a missing key means the type cannot be created. The client copies this value into TriggerModel.Version when it creates a rule.
    - SmartRuleErrorStatuses (Dictionary<int,int>): TriggerId -> packed TriggerErrorStatus (bits 8-15 error count, 16-23 warning count, 24-31 info count).
    - UserPermissionsForTriggers / GroupPermissionsForTriggers / DefaultGroupPermissionsForTriggers with their changeset ids.
    The legacy fields SmartRulesChangesetId (Guid) and Smartrules (JSON string) belong to the pre-v24 format and are ignored by this client.
    If any TriggerModel fails to deserialize the app sets SmartRulesDeserializeError and refuses all smart rule writes (to avoid destroying data it cannot read). A CLI must apply the same rule.
    Transport/auth fields of MessageReconnectRequest are documented elsewhere.
  minProtocolVersion: 24
  evidence:
  - 'TapHome.Android: Com.TapHome.Communication.ClientCommunicationManager.HandleReconnect'
  - 'TapHome.Android: Com.TapHome.Communication.ClientCommunicationManager.SendReconnect'
  confidence: observed-in-code
- id: smartRuleChanges
  tag: automations
  kind: subscribe
  request: null
  response: null
  broadcasts:
  - MessageTriggerModelsUpdatedBroadcast
  - MessageTriggerModelsDeletedBroadcast
  summary: Push notifications when smart rules are created, changed or deleted (by any client).
  description: |-
    No subscribe request is needed; the Core pushes these to every logged-in client.
    - MessageTriggerModelsUpdatedBroadcast: TriggerModels (List<byte[]>, protobuf TriggerModel each, includes Core-computed TriggerInputs and the new Id for created rules) and SmartRulesChangesetId (int). A TriggerModel with IsDeleted = true must be treated as a delete.
    - MessageTriggerModelsDeletedBroadcast: TriggerIds (List<int>) and SmartRulesChangesetId. The client also removes the error status for those ids.
    Both carry the new global smart rule changeset; the client stores it and sends it back on the next reconnect.
    This is the only place a client learns the Core-assigned Id of a rule it just created, since the write response carries no payload.
  minProtocolVersion: 24
  evidence:
  - 'TapHome.Android: Com.TapHome.Communication.ClientCommunicationManager.HandleBroadcast (MessageTriggerModelsUpdatedBroadcast,
    MessageTriggerModelsDeletedBroadcast)'
  confidence: observed-in-code
- id: upsertSmartRules
  tag: automations
  kind: write
  request: MessageUpdateTriggerModelsRequest
  response: MessageGenericResponse
  broadcasts:
  - MessageTriggerModelsUpdatedBroadcast
  summary: Create or update one or more smart rules (also used to enable/disable, rename, reorder priority and duplicate).
  description: |-
    Request: TriggerModels (List<TriggerModel>). One message is both "add" and "update"; the Id decides.
    Create: Id = 0. The Core allocates the Id (client never does) and returns it only through MessageTriggerModelsUpdatedBroadcast.
    Update: send the complete TriggerModel with its existing Id. The app always sends the whole object after editing a deserialized copy; there is no partial update.
    Fields the client sets on create: TriggerType (TriggerTypeId), TriggerParameters (the concrete ...TriggerParameters subclass that matches the type and version), Name (unique-ified client side, for example "Formula", "Formula 2"), IsEnabled = true, Version = TriggerVersions[type] from the reconnect response, Priorities = empty dictionary. IsLimitingConditionEnabled/LimitingConditionType/LimitingConditionParameters are optional (not allowed for safety triggers, type id >= 10000).
    Fields the Core computes and the client should not send meaningfully: TriggerInputs and LimitingConditionInputs (device connection index derived from the parameters; the app sets TriggerInputs = null when duplicating), ChangesetId, IsDeleted.
    Priorities: Dictionary<deviceId, priority>, per output device; higher number wins. The app edits it when the user drags rules in a device's output list and sends the changed rules in one batch. Whether the Core fills Priorities for new rules itself is not visible in the client (see open questions).
    Enable/disable = send the rule with IsEnabled flipped. Duplicate = clone, Id = 0, new Name, Priorities = null, TriggerInputs = null.
    Response: MessageGenericResponse; ErrorCode 1 = saved, 16 = Core does not support this rule version (app toast "incompatible Core smart rule version"). The Core persists on receipt (it is the source of truth; the client cache is only updated from the broadcast).
    Saved formulas and scripts are not validated by this call in the client. The Core parses them and reports problems afterwards through the trigger error operations.
    Permissions: the user needs UserSettingsCanEdit on the rule (existing) or CreateSmartRuleCanEdit for the type (new); the Core enforces this.
    Atomicity across the list is unknown; the app sends several rules in one message for bulk enable/disable and priority changes.
  minProtocolVersion: 24
  evidence:
  - 'TapHome.Android: TapHome.Commons.SmartRuleCommunicationHelper.UpdateSmartRules'
  - 'TapHome.Android: TapHome.Commons.CommonPages.SmartRulePage`1.InitSmartRule'
  - 'TapHome.Android: TapHome.Commons.SmartRuleCommunicationHelper.DuplicateSmartRule'
  - 'TapHome.Android: TapHome.Commons.CommonHelpers.MultiSelectHelper.HandleSmartRuleEnableDisableClicked'
  - 'TapHome.Android: CommonUI.CommonMainList.ViewModel.OutputSmartRuleElementsSectionViewModel.UpdateSmartRulesPriorities'
  confidence: observed-in-code
- id: deleteSmartRules
  tag: automations
  kind: write
  request: MessageDeleteTriggerModelsRequest
  response: MessageGenericResponse
  broadcasts:
  - MessageTriggerModelsDeletedBroadcast
  summary: Delete (uninstall) smart rules by id.
  description: |-
    Request: TriggerIds (List<int>). The app deletes one rule at a time from the rule page and the device bottom sheet, and several at once from multi-select.
    Only the transport success of the task is checked by the app, not ErrorCode; assume MessageGenericResponse with ErrorCode 1 on success.
    The Core deletes softly (the model keeps IsDeleted = true with a new ChangesetId so offline clients can catch up) and broadcasts MessageTriggerModelsDeletedBroadcast.
    Requires UninstallSmartRuleCanEdit on each rule (checked by the UI; the Core enforces it).
    Disabling is a different operation (upsertSmartRules with IsEnabled = false). Deleting does not remove the rule's permissions rows in the client cache until the permission broadcasts arrive.
  minProtocolVersion: 24
