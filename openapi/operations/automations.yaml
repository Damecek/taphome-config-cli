# Operations for smart rules (automations), schedules (week plans, date ranges) and smart rule permissions.
# Format of every entry (all files in this directory share it):
#   id                  unique operationId
#   tag                 one of the spec tags
#   kind                read | write | subscribe | action
#   request / response  protobuf class names from work/catalog/official.json (null when none)
#   broadcasts          broadcast classes the Core pushes as a consequence
#   summary, description, minProtocolVersion, evidence, confidence
#   endpoint            optional, WebSocket endpoint (default /Core)
#   security            optional, "none" for operations that need no session
#   bareResponse        optional, the endpoint sends the response class without a MessageBase wrapper
# Source: static reading of the decompiled TapHome Official Android app 2025.2.32375. Nothing here is verified against a live Core
# unless openapi/verification.yaml says so. "GenericResponse OK" means MessageGenericResponse with ErrorCode == 1.

- id: getScriptLastRunValues
  tag: scripts
  kind: read
  request: MessageGetScriptLastRunValuesRequest
  response: MessageGetScriptLastRunValuesReponse
  broadcasts: []
  summary: Fetch the values captured during the last execution of a formula, script smart rule or device script,
    for debugging.
  description: |-
    Request: LastRunId = ScriptLastRunValuesIdentifier {ObjectIdType (0 Device, 1 Ccu, 2 Smartrule), ObjectId (int; the TriggerId for smart rules, -1 for an unsaved rule), ScriptKey (string; names which script of a device/CCU, empty for smart rules)}.
    Response class name has a typo in the app ("Reponse"): MessageGetScriptLastRunValuesReponse with LastRunId and Values = ScriptLastRunValues {Values (per-statement snapshots, list of name -> DataType maps), Result (DataType), RunTimestampUtc, RunDuration}. DataType is a tagged union (see the data type table in 04-automations.md).
    The script engine records snapshots at Start/Progress/Finish phases and keeps only the last run in memory on the Core, so the data is empty until the rule has run at least once. Used by the "last run" button in the script editor. Works for formula (type 12), script (type 45) and evaluation rules.
  minProtocolVersion: 61
