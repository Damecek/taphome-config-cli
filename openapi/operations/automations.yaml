- id: getSmartRuleErrors
  tag: automations
  kind: read
  request: MessageGetTriggerErrorsRequest
  response: MessageGetTriggerErrorsResponse
  broadcasts:
  - MessageTriggerErrorsSubscribedBroadcast
  summary: Read the current errors, warnings and infos of one smart rule, optionally subscribing to changes.
  description: |-
    Request: TriggerId (int), ShouldSubscribe (bool). Response: TriggerErrors (List<TriggerError>).
    TriggerError: TapHomeTime (int, Core time stamp), ErrorCodeId (TriggerErrorCode), CustomText (string; script ADDERROR/ADDWARNING/ADDINFO text), SeverityId (1 Info, 2 Warning, 3 Error), ErrorAreaId (0 None, 1 LimitingCondition), DeviceIds (List<int>), ErrorSpecifiers (set of code/int pairs, for example the device type or variable type involved).
    TriggerErrorCode values: 1 MissingDevice, 2 MissingAction, 3 MissingVariable, 101-103 Deleted device/action/variable, 201 FormulaParseException, 202 FormulaEvaluationException, 203 LiteralArgumentException, 301-303 push button long/double/triple press not supported, 401-403 hysteresis temperature limit problems.
    This is how a formula or script with a syntax error is reported after saving (code 201 with CustomText holding the parser message).
