        required: true
        schema:
          type: string
        description: ''
      - name: ruleId
        in: path
        required: true
        schema:
          type: string
        description: ''
      - name: fileName
        in: path
        required: true
        schema:
          type: string
        description: ''
      responses:
        '200':
          description: File content
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
      x-evidence:
      - 'TapHome.Android: TapHome.Core.Lib.Communication.SoftwareUpdatesClient.DownloadBinaryFile'
      x-confidence: observed-in-code
      x-verified: false
schemas:
  CloudRegisterUserModel:
    type: object
    properties:
      deviceId:
        type: string
      platform:
        type: string
      softwareVersion:
        type: string
      email:
        type: string
      password:
        type: string
      name:
        type: string
      languageCode:
        type: string
      pushProviderId:
        type: integer
        description: The app sends 0.
  CloudLoginUserModel:
    type: object
    properties:
      deviceId:
        type: string
      platform:
        type: string
      softwareVersion:
        type: string
      email:
        type: string
      password:
        type: string
      languageCode:
        type: string
      loginAsGroup:
        type: string
        description: Unused by the app.
      deviceName:
        type: string
  CloudUserInfo:
    type: object
    properties:
      userId:
        type: string
        format: uuid
      login:
        type: string
      email:
        type: string
      name:
        type: string
      createdOnUtc:
        type: string
        format: date-time
      languageCode:
        type: string
  CloudClientDeviceInfo:
    type: object
    properties:
      clientDeviceId:
        type: integer
        format: int64
      deviceId:
        type: string
      pushId:
        type: string
      softwareVersion:
        type: string
      deviceName:
        type: string
      platform:
        type: string
  CloudUserLocation:
    type: object
    properties:
      locationId:
        type: string
        format: uuid
      name:
        type: string
      authorizationToken:
        type: string
        format: uuid
        description: Per user and location credential, used as the secret in a cloud-account login to the Core.
          Treat as a secret.
      ipOnLocalNetwork:
        type: string
      partialAccessToken:
        type: string
        description: Masked setup token, only the last 4 characters are real.
  CloudCompleteUserInformation:
    type: object
    properties:
      userInfo:
        $ref: '#/components/schemas/CloudUserInfo'
      clientDeviceInfo:
        $ref: '#/components/schemas/CloudClientDeviceInfo'
      myLocations:
        type: array
        items:
          $ref: '#/components/schemas/CloudUserLocation'
  CloudGlobalUserRegisterLoginResponse:
    type: object
    properties:
      token:
        type: string
        description: Bearer token for the other cloud calls.
      myInfo:
        $ref: '#/components/schemas/CloudCompleteUserInformation'
  CloudChangeUserPasswordModel:
    type: object
    properties:
      oldPassword:
        type: string
      newPassword:
        type: string
  CloudChangeUserNameModel:
    type: object
    properties:
      name:
        type: string
  CloudDeleteMyUserAccountModel:
    type: object
    properties:
      email:
        type: string
      password:
        type: string
  CloudForgottenUserPasswordModel:
    type: object
    properties:
      email:
        type: string
      languageCode:
        type: string
  CloudUpdateClientDeviceModel:
    type: object
    properties:
      deviceId:
        type: string
      platform:
        type: string
      softwareVersion:
        type: string
      deviceName:
        type: string
      pushId:
        type: string
  CloudDeleteClientDeviceModel:
    type: object
    properties:
      deviceId:
        type: string
      platform:
        type: string
  CloudUpdateClientDeviceGetGlobalUserInfoModel:
    type: object
    properties:
      deviceId:
        type: string
      platform:
        type: string
      softwareVersion:
        type: string
      deviceName:
        type: string
      languageCode:
        type: string
  CloudUserLocationsStatusRequest:
    type: object
    properties:
      locationIds:
        type: array
        items:
          type: string
          format: uuid
  CloudUserLocationsStatusReplyElement:
    type: object
    properties:
      locationId:
        type: string
        format: uuid
      isOnline:
        type: boolean
      connectionCreatedOnUtc:
        type: string
        format: date-time
      disconnectedOnUtc:
        type: string
        format: date-time
  CloudUserStatusRequest:
    type: object
    properties:
      logins:
        type: array
        items:
          type: string
  CloudUserStatusReplyElement:
    type: object
    properties:
      userId:
        type: string
        format: uuid
      login:
        type: string
      userRegistration:
        type: integer
        description: 0 NotFound, 1 Placeholder, 2 Valid.
      registeredOnUtc:
        type: string
        format: date-time
  CloudTunnelEndpointsResponse:
    type: object
    properties:
      tunnels:
        type: array
        items:
          type: string
      cloudTimeUtc:
        type: string
        format: date-time
      updatesHost:
        type: string
        description: Host of the firmware and update rules API.
      crmUserApiHost:
        type: string
        description: Seen in the live response (appservices.taphome.com). Not used by the app.
  CloudHistorySasSignature:
    type: object
    properties:
      tableName:
        type: string
      expiryTime:
        type: string
        format: date-time
      saSToken:
        type: string
        description: Azure Table Storage SAS token. Treat as a secret.
  CloudErrorBody:
    type: object
    description: Problem details body. Some failures return a bare integer CommonErrorCodes value or plain text
      instead.
    properties:
      type:
        type: string
      title:
        type: string
      status:
        type: integer
      detail:
        type: string
      instance:
        type: string
