  /api/rules:
    get:
      operationId: updatesGetRules
      tags:
      - cloud-api
      summary: Download the upgrade rules file
      description: JSON UpgradeRulesFile with Core, firmware, image and package rules. The app also sends HEAD first,
        and may add ?shorttoken=<last 4 chars of the Core access token>. Bearer is sent for cloud users and omitted
        for local users. The app forces User-Agent curl/7.78.0.
      security:
      - cloudBearer: []
      servers:
      - url: https://{updatesHost}
        description: Firmware and update rules host, from tunnelendpoints3 (updatesHost)
        variables:
          updatesHost:
            default: updates.invalid
            description: Value of updatesHost in the tunnelendpoints3 response.
      parameters:
      - name: shorttoken
        in: query
        required: false
        schema:
          type: string
        description: ''
      responses:
        '200':
          description: Upgrade rules
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
      x-evidence:
      - 'TapHome.Android: TapHome.Core.Lib.Communication.SoftwareUpdatesClient.DownloadUpgradeRulesFile'
      x-confidence: observed-in-code
      x-verified: false
  /api/binaries/{fileTypeAndBranch}/{ruleId}/{fileName}:
    get:
      operationId: updatesGetBinary
      tags:
      - cloud-api
      summary: Download an update binary
      description: Resumable with the Range header. Integrity from the Content-MD5 header (base64) and the hash
        in the rules file. The app then pushes the file to the Core in chunks with MessageUpdateCoreRequest or MessageUpdateModuleFirmwareRequest.
      security:
      - cloudBearer: []
      servers:
      - url: https://{updatesHost}
        description: Firmware and update rules host, from tunnelendpoints3 (updatesHost)
        variables:
          updatesHost:
            default: updates.invalid
            description: Value of updatesHost in the tunnelendpoints3 response.
      parameters:
      - name: fileTypeAndBranch
